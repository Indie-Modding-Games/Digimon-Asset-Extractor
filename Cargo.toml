[package]
name = "dw-extract"
version = "0.1.0"
edition = "2021"
description = "Digimon World (SLUS-01032) asset extractor"
license = "MIT"
repository = "https://github.com/jype0/dw_decomp"

[dependencies]
anyhow = "1.0"
binrw = "0.10"
bincode = "1.3"
bytemuck = "1.15"
byteorder = "1.5"
clap = { version = "4.4", features = ["derive"] }
crc = "3.0"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.29"
rfd = "0.13"
hex = "0.4"
hound = "3.5"
image = "0.25"
indoc = "2.0"
md5 = "0.7"
nom = "7.1"
num-derive = "0.4"
num-traits = "0.2"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1.0"
walkdir = "2.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "dw-extract"
path = "src/main.rs"

[[bin]]
name = "parse-table"
path = "debug/parse_table.rs"

[[bin]]
name = "dw-extract-gui"
path = "src/gui_main.rs"